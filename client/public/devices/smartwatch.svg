<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="watchBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#181c24" />
      <stop offset="50%" stop-color="#252c38" />
      <stop offset="100%" stop-color="#181c24" />
    </linearGradient>
    <linearGradient id="chassisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b4252" />
      <stop offset="50%" stop-color="#2e3440" />
      <stop offset="100%" stop-color="#1a1e28" />
    </linearGradient>
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#0b101b" />
      <stop offset="100%" stop-color="#05080e" />
    </radialGradient>
  </defs>

  <!-- Watch Straps (Top and Bottom extending vertically) -->
  <path d="M 160 10 L 240 10 L 235 60 L 165 60 Z" fill="url(#watchBand)" stroke="#334155" stroke-width="2" />
  <path d="M 165 180 L 235 180 L 240 230 L 160 230 Z" fill="url(#watchBand)" stroke="#334155" stroke-width="2" />

  <!-- Strap texture ridges -->
  <line x1="168" y1="25" x2="232" y2="25" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
  <line x1="167" y1="38" x2="233" y2="38" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
  <line x1="166" y1="202" x2="234" y2="202" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
  <line x1="167" y1="215" x2="233" y2="215" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />

  <!-- Watch Chassis Outer Body -->
  <rect x="140" y="58" width="120" height="124" rx="36" fill="url(#chassisGrad)" stroke="url(#bezelGrad)" stroke-width="3" />

  <!-- Crown / Pushers on side -->
  <rect x="259" y="85" width="8" height="24" rx="2" fill="#64748b" stroke="#334155" stroke-width="1.5" />
  <rect x="259" y="130" width="6" height="18" rx="2" fill="#64748b" stroke="#334155" stroke-width="1.5" />

  <!-- Bezel Dial Ring -->
  <circle cx="200" cy="120" r="52" fill="#080c14" stroke="#475569" stroke-width="2.5" />
  <circle cx="200" cy="120" r="48" fill="url(#screenGlow)" stroke="#ff4d55" stroke-width="1.5" stroke-dasharray="2 3" />

  <!-- Screen Content: Heart Rate & SpO2 Display -->
  <!-- Pulse Icon -->
  <path d="M 180 94 L 186 94 L 189 86 L 193 102 L 197 78 L 202 108 L 206 94 L 210 90 L 214 94 L 220 94" fill="none" stroke="#ff4d55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- HR Number -->
  <text x="200" y="126" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="22" fill="#ffffff" text-anchor="middle">72</text>
  <text x="200" y="136" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="7.5" fill="#ff4d55" text-anchor="middle" letter-spacing="1">BPM · RESTING</text>

  <!-- Metric Badges: SpO2 and Temp -->
  <rect x="168" y="142" width="28" height="12" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="182" y="151" font-family="monospace" font-size="6.5" fill="#38bdf8" text-anchor="middle">98%</text>

  <rect x="204" y="142" width="28" height="12" rx="3" fill="#0f172a" stroke="#22c55e" stroke-width="1" />
  <text x="218" y="151" font-family="monospace" font-size="6.5" fill="#22c55e" text-anchor="middle">36.6°</text>

  <!-- Status / Brand -->
  <text x="200" y="76" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="6.5" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">ARTEMIS CREW WATCH</text>
</svg>
